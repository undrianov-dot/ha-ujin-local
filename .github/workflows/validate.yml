name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-hacs, validate-hassfest, protocol-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v5
      - name: Publish manifest version after validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="v$(python -c 'import json; print(json.load(open("custom_components/ujin_local/manifest.json"))["version"])')"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it unchanged."
            exit 0
          fi
          cd custom_components
          zip -r ../ujin_local.zip ujin_local -x '*/__pycache__/*' '*.pyc'
          cd ..
          gh release create "$VERSION" ujin_local.zip --target "$GITHUB_SHA" --title "UJIN Local $VERSION" --notes-file "RELEASE_NOTES_${VERSION#v}.md"
